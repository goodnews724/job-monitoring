x-airflow-common: &airflow-common
  build: .
  # image: goodnews724/kowork-scaper-arm:latest
  # platform: linux/arm64
  env_file:
    - ./.env
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=30
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW_UID=50000
    - AIRFLOW_GID=0
    - GOOGLE_SHEET_KEY=${GOOGLE_SHEET_KEY}
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    - TOP5000COMPANY_URL=${TOP5000COMPANY_URL}
    # 메모리 최적화 설정
    - AIRFLOW__WEBSERVER__WORKERS=2
    - AIRFLOW__WEBSERVER__BASE_URL=http://localhost:8080
    - AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT=8793
    - AIRFLOW__CORE__PARALLELISM=8
    - AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG=1
    # Airflow 관리자 계정 자동 생성
    - _AIRFLOW_WWW_USER_USERNAME=admin
    - _AIRFLOW_WWW_USER_PASSWORD=admin123
    - _AIRFLOW_WWW_USER_EMAIL=admin@example.com
    - _AIRFLOW_WWW_USER_FIRSTNAME=Admin
    - _AIRFLOW_WWW_USER_LASTNAME=User
    - _AIRFLOW_WWW_USER_ROLE=Admin
  volumes:
    - ./src:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./key:/opt/airflow/key
    - ./data:/opt/airflow/data
  user: "50000:0"
  depends_on:
    - postgres
    - redis
  links:
    - postgres
  networks:
    - airflow-network

services:
  postgres:
    image: postgres:13
    platform: linux/arm64
    restart: unless-stopped
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - airflow-network

  redis:
    image: redis:latest
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - airflow-network

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    command: bash -c "airflow db init && airflow users create --username admin --password admin123 --firstname Admin --lastname User --role Admin --email admin@example.com || true && airflow webserver"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    command: bash -c "airflow serve-logs & airflow scheduler"
    ports:
      - "8793:8793"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 30s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    platform: linux/arm64
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - ./data:/app/data  # CSV 파일 접근용
    networks:
      - airflow-network

volumes:
  postgres-db:

networks:
  airflow-network:
    driver: bridge
